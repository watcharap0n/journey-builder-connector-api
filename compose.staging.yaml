name: cdp-stg-connector-api
# Staging on the cdp-stg box (Mon-Fri 08:00-20:00 ICT). Deployed by CI from the develop
# branch through .github/scripts/staging-deploy.sh, which writes REGISTRY/IMAGE_TAG into .env.
# Secrets and DB settings: .env.staging on the box. migrate runs alembic like prod CI.

x-worker: &worker
  image: ${REGISTRY}/cdp/connector-api:${IMAGE_TAG}
  env_file: .env.staging
  restart: unless-stopped
  mem_limit: 384m

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *worker
    restart: "no"
    command: [alembic, upgrade, head]
    healthcheck:
      disable: true

  api:
    <<: *worker
    mem_limit: 512m
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - 127.0.0.1:8100:8100
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  connector-outbox:
    <<: *worker
    command: [python, -m, app.workers.connectors, outbox]
    healthcheck:
      disable: true

  connector-occurrence:
    <<: *worker
    command: [python, -m, app.workers.connectors, occurrence]
    healthcheck:
      disable: true

  connector-result:
    <<: *worker
    command: [python, -m, app.workers.connectors, result]
    healthcheck:
      disable: true

volumes:
  redis_data:
