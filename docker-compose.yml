services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${JOURNEY_BUILDER_API_IMAGE:-journey-builder-api:local}
    build: .
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8100:8100"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  connector-outbox:
    image: ${JOURNEY_BUILDER_API_IMAGE:-journey-builder-api:local}
    env_file:
      - .env
    command: ["python", "-m", "app.workers.connectors", "outbox"]
    healthcheck:
      disable: true
    restart: unless-stopped

  connector-occurrence:
    image: ${JOURNEY_BUILDER_API_IMAGE:-journey-builder-api:local}
    env_file:
      - .env
    command: ["python", "-m", "app.workers.connectors", "occurrence"]
    healthcheck:
      disable: true
    restart: unless-stopped

  connector-result:
    image: ${JOURNEY_BUILDER_API_IMAGE:-journey-builder-api:local}
    env_file:
      - .env
    command: ["python", "-m", "app.workers.connectors", "result"]
    healthcheck:
      disable: true
    restart: unless-stopped

  standardization-outbox:
    image: ${JOURNEY_BUILDER_API_IMAGE:-journey-builder-api:local}
    env_file:
      - .env
    command: ["python", "-m", "app.workers.standardization", "outbox"]
    healthcheck:
      disable: true
    restart: unless-stopped

  standardization-result:
    image: ${JOURNEY_BUILDER_API_IMAGE:-journey-builder-api:local}
    env_file:
      - .env
    command: ["python", "-m", "app.workers.standardization", "result"]
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  redis_data:
